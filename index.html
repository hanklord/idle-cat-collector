<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Idle Cat Collector</title><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#17152b;color:#fff;font-family:var(--font);overflow:hidden}#app{position:relative;width:min(100vw,600px);height:min(100vh,1067px);margin:auto;background:#29234c;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%}#hud{position:absolute;top:0;left:0;right:0;padding:14px 18px;display:flex;justify-content:space-between;background:linear-gradient(#17152bdd,transparent);pointer-events:none}.stat{font-size:14px;text-shadow:0 2px 3px #000}.stat strong{display:block;color:#ffd86b;font-size:20px}#rate{color:#a6f2b0}#view{position:absolute;inset:58px 0 70px;overflow:auto}#bottom{position:absolute;bottom:0;left:0;right:0;height:70px;display:flex;background:#18152ddd;border-top:1px solid #665a9a}#bottom button{flex:1;background:none;border:0;color:#ddd;font:14px var(--font);cursor:pointer}#bottom button.active{color:#ffd86b;background:#39305f}#panel{display:none;position:absolute;inset:58px 12px 82px;background:#211c3eee;border:1px solid #7565a8;border-radius:12px;padding:16px;overflow:auto;z-index:4}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:#332b56;border:1px solid #665a9a;border-radius:10px;padding:10px;cursor:pointer}.card h3{margin:4px 0;color:#ffd86b}.muted{color:#aaa;font-size:12px}.action{background:#8064d9;border:0;border-radius:8px;color:#fff;padding:10px 15px;font:14px var(--font);cursor:pointer}.action:disabled{opacity:.45}.close{float:right;background:none;border:0;color:#fff;font-size:20px}.modal{position:absolute;inset:35% 10%;z-index:8;background:#29234c;border:2px solid #ffd86b;border-radius:14px;text-align:center;padding:20px;box-shadow:0 8px 30px #000}.hidden{display:none!important}
</style></head><body><div id="app"><canvas id="scene"></canvas><div id="hud"><div class="stat">💰 金幣<strong id="coins">0</strong></div><div class="stat" id="rate">產出 0/s</div></div><div id="view"></div><div id="panel"></div><div id="bottom"><button data-page="home" class="active">🏠<br>家園</button><button data-page="collection">📖<br>圖鑑</button><button data-page="gacha">🥚<br>扭蛋</button><button data-page="upgrade">⬆<br>升級</button></div><div id="offline" class="modal hidden"><h2>離線收益</h2><p id="offline-text"></p><button class="action" id="offline-ok">領取</button></div></div>
<script>document.documentElement.style.setProperty('--font',"Cinzel, 'Noto Sans TC', serif")</script><script src="config.js"></script><script src="js/utils.js"></script><script src="js/save-system.js"></script><script src="js/audio.js"></script><script src="js/cat.js"></script><script src="js/scene.js"></script><script src="js/gacha.js"></script><script src="js/upgrade.js"></script><script src="js/collection.js"></script><script src="js/ui.js"></script><script src="js/game.js"></script><script src="js/main.js"></script></body></html>
